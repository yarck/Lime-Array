name: Build Lime-Array APK

on:
  push:
    branches: [lime-array]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: LimeStudio
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          ./gradlew --no-daemon :app:assembleDebug

      - name: Locate APK
        id: apk
        run: |
          apk=$(ls LimeStudio/app/build/outputs/apk/debug/*.apk | head -1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk")" >> "$GITHUB_OUTPUT"
          ls -la "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "Lime-Array 最新版 (${GITHUB_SHA::7})" \
            --notes "由 lime-array 分支自動建置。下載 APK 後直接安裝；之後的新版可直接覆蓋更新。" \
            --prerelease
